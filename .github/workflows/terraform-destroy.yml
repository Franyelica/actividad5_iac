name: terraform-destroy

# Solo manual, y hay que escribir "destroy" para confirmar.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para borrar toda la infraestructura'
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_moodle_admin_password: ${{ secrets.MOODLE_ADMIN_PASSWORD }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'destroy' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - run: terraform destroy -no-color -input=false -auto-approve
